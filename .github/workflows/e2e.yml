# The QA E2E regression suite (formerly e2e-nightly.yml — renamed when the
# nightly schedule stopped being its only trigger). Runs against QA: the full
# Playwright suite nightly (safety net), after each healthy QA backend deploy
# (repository_dispatch: qa-deploy), and manually for targeted runs — plus the
# customer project only after each storefront deploy (repository_dispatch:
# template-deploy from template-wind's notify-e2e.yml).
# See CI_PLAN.md for the full pipeline design and the secrets/vars this needs
# (GitHub environment `qa`: OWNER/ADMIN/EMPLOYEE creds + Mailpit; repo vars:
# URLs + SEED_RESTAURANT_ID). Until those are configured this workflow will
# run but skip most tests via the suite's own env guards.
name: e2e

# Surface the prod-gate marker in the run name so RestauNax's prod-gate workflow
# can correlate the run it dispatched. Plain "e2e" for every other trigger.
run-name: >-
  ${{ (github.event_name == 'repository_dispatch' && github.event.client_payload.marker) && format('e2e {0}', github.event.client_payload.marker) || 'e2e' }}

on:
  schedule:
    # 06:00 UTC — before the workday, after overnight QA deploys.
    - cron: "0 6 * * *"
  # qa-deploy: fired by the RestauNax repo's post-deploy-smoke.yml after each
  # healthy QA backend deploy (once the new container passes its health gate).
  # template-deploy: fired by a storefront repo's notify-e2e.yml after its
  # Dokploy QA deploy settles; client_payload.repo says which storefront, and
  # the run step narrows to that storefront's customer tests.
  repository_dispatch:
    types: [qa-deploy, template-deploy]
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional --grep filter (e.g. TC-26 or a describe title)"
        required: false
        default: ""
      project:
        description: "Playwright project to run"
        type: choice
        options: [all, dashboard, customer]
        default: all

# The suite mutates a single shared QA environment: two runs at once interfere
# (shared accounts, seed restaurant, demo requests). ONE concurrency group for
# every Playwright-running workflow; never cancel in progress — a killed run
# skips globalTeardown and leaves QA residue.
concurrency:
  group: qa-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: github.repository == 'Restaunax/Automation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa
    outputs:
      # Consumed by the report job's environment URL chip below.
      report_url: ${{ steps.report-subfolder.outputs.url }}
    # peaceiris/actions-gh-pages pushes the built Allure report to the gh-pages
    # branch using the default GITHUB_TOKEN, which needs write access to contents.
    permissions:
      contents: write
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      TEMPLATE_WIND_URL: ${{ vars.TEMPLATE_WIND_URL }}
      TEMPLATE_WIND_RESTAURANT_ID: ${{ vars.TEMPLATE_WIND_RESTAURANT_ID }}
      SEED_RESTAURANT_ID: ${{ vars.SEED_RESTAURANT_ID }}
      TEST_EMAIL_DOMAIN: ${{ vars.TEST_EMAIL_DOMAIN }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_EMAIL: ${{ secrets.EMPLOYEE_EMAIL }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      # QA's self-hosted Mailpit inbox. The password is a secret so Actions
      # masks it in logs; the URL is not sensitive.
      MAILPIT_BASE_URL: ${{ vars.MAILPIT_BASE_URL }}
      MAILPIT_UI_USER: ${{ secrets.MAILPIT_UI_USER }}
      MAILPIT_UI_PASSWORD: ${{ secrets.MAILPIT_UI_PASSWORD }}
      # publish-results.ts reads these only if set. The backend ingest endpoint +
      # Grafana dashboard were BACKED OUT (see restaunax-backend migration
      # remove_qa_test_results, 2026-07-09), so the POST is a no-op today — the
      # Slack alert below is the part that still works. Trend history now comes
      # from the Allure report published to GitHub Pages (steps further down).
      RESULTS_URL: ${{ secrets.RESULTS_URL }}
      RESULTS_API_KEY: ${{ secrets.RESULTS_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # What triggered this run (recorded on the run row).
      E2E_TRIGGER: >-
        ${{ github.event_name == 'schedule' && 'nightly'
          || github.event.action == 'template-deploy' && 'wind-deploy'
          || github.event_name == 'repository_dispatch' && 'qa-deploy'
          || 'manual' }}
      # For repository_dispatch, the SHA/ref of the qa commit under test come
      # from the dispatch payload; otherwise fall back to this repo's context.
      GITHUB_SHA: ${{ github.event.client_payload.sha || github.sha }}
      GITHUB_REF_NAME: ${{ github.event.client_payload.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          GREP: ${{ inputs.grep }}
          PROJECT: ${{ inputs.project }}
          DISPATCH_TYPE: ${{ github.event.action }}
          DEPLOY_REPO: ${{ github.event.client_payload.repo }}
        run: |
          # Email-sending tests (@email) run here too — QA sends to a self-hosted,
          # unmetered Mailpit inbox, so there is no quota to protect. They need
          # MAILPIT_* above; without it the suite's own env guards skip them.
          # No --reporter override: use the config reporters (list + json →
          # results.json for the publish step + allure). A CLI --reporter would
          # drop the json reporter and its configured outputFile.
          #
          # A template-deploy dispatch means one storefront changed: run only its
          # customer tests, not the whole suite (backend deploys still run all).
          if [ "$DISPATCH_TYPE" = "template-deploy" ]; then
            case "$DEPLOY_REPO" in
              template-wind) PROJECT=customer ;;
              *) echo "unknown deploy repo '$DEPLOY_REPO' in template-deploy payload" >&2; exit 1 ;;
            esac
          fi
          ARGS=()
          if [ -n "$GREP" ]; then ARGS+=(--grep "$GREP"); fi
          if [ -n "$PROJECT" ] && [ "$PROJECT" != "all" ]; then ARGS+=(--project="$PROJECT"); fi
          npx playwright test "${ARGS[@]}"

      - name: Generate Allure HTML report
        if: always()
        run: npx allure generate allure-results -o allure-report --clean

      # ── Publish the Allure report to GitHub Pages ─────────────────────────────
      # One clickable URL (https://restaunax.github.io/Automation/nightly/ — the
      # site root redirects there) that always shows the latest run plus a Trend
      # widget of the last 30 runs — no artifact download, no local server, no
      # Java. History is pulled from the gh-pages branch so trends accumulate
      # across runs. All if: always() so a FAILING suite still publishes its
      # report (that's exactly when you want to see it).
      #
      # Each suite MUST live in its own subfolder (this one: nightly/, the weekly
      # email job: email/): simple-elf's keep_reports cleanup runs
      # `ls | sort -n | head -n -N | xargs rm -rv` in its publish dir, and
      # non-numeric names sort first — a sibling report parked next to the run
      # folders would be the first thing deleted. Subfolders scope the cleanup;
      # the site root is never cleaned.
      # Full-suite runs (nightly / qa-deploy / manual) publish to nightly/;
      # storefront-deploy runs get their own subfolder (wind-deploy/) — both
      # because simple-elf cleanup would delete a sibling report (see above) and
      # because customer-only runs interleaved into nightly/ would wreck the
      # trend widget's test counts.
      - name: Resolve Allure report subfolder
        id: report-subfolder
        if: always()
        env:
          DISPATCH_TYPE: ${{ github.event.action }}
          DEPLOY_REPO: ${{ github.event.client_payload.repo }}
        run: |
          SUB=nightly
          if [ "$DISPATCH_TYPE" = "template-deploy" ]; then
            SUB="${DEPLOY_REPO#template-}-deploy" # template-wind → wind-deploy
          fi
          echo "REPORT_SUBFOLDER=$SUB" >> "$GITHUB_ENV"
          echo "url=https://restaunax.github.io/Automation/$SUB/" >> "$GITHUB_OUTPUT"

      - name: Fetch prior Allure history
        if: always()
        continue-on-error: true # gh-pages doesn't exist yet on the very first run
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Migrate legacy root history to nightly/
        if: always()
        run: |
          # The report used to live at the site root; seed nightly/ from the
          # legacy layout so the Trend widget doesn't reset. No-op once
          # nightly/ exists.
          if [ -d gh-pages/last-history ] && [ ! -d gh-pages/nightly ]; then
            mkdir -p gh-pages/nightly
            cp -r gh-pages/last-history gh-pages/nightly/last-history
          fi

      - name: Build Allure report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: ${{ env.REPORT_SUBFOLDER }}
          keep_reports: 30

      # simple-elf runs as root in a container and copies the checked-out gh-pages
      # folder — including its .git — into allure-history. peaceiris then can't
      # delete that root-owned .git (EACCES) and its push fails. Strip it (sudo,
      # because the files are root-owned) so peaceiris sees only report files.
      # Also drop the pre-subfolder legacy layout: after the migration above,
      # every real run lives under nightly/, so numeric dirs + last-history at
      # the root are stale copies (idempotent — globs just miss once gone).
      - name: Strip the stray .git + legacy root layout from the report dir
        if: always()
        run: sudo rm -rf allure-history/.git allure-history/last-history allure-history/[0-9]*

      # The documented URL is the site root; keep it working now that reports
      # live in subfolders. sudo tee, NOT a plain redirect (>): simple-elf's
      # container creates allure-history/ contents as root, so an unprivileged
      # write fails with EACCES and the stale legacy index ships instead.
      - name: Write root index redirect
        if: always()
        run: |
          sudo tee allure-history/index.html > /dev/null <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=./nightly/" />
            <title>Restaunax E2E reports</title>
          </head>
          <body>
            <p>Redirecting to the <a href="./nightly/">full-suite report</a>&hellip;</p>
            <p>
              Also available: <a href="./wind-deploy/">wind-deploy customer runs</a>
              &middot; <a href="./email/">weekly @email runs</a>
            </p>
          </body>
          </html>
          EOF

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Link hosted report in run summary
        if: always()
        run: |
          echo "### 📊 Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://restaunax.github.io/Automation/$REPORT_SUBFOLDER/ — live once pages-build-deployment finishes (~1 min)" >> "$GITHUB_STEP_SUMMARY"

      # Parse results.json, detect a mid-run deploy (superseded), and Slack on
      # real failures. (The Grafana ingest POST is a no-op — endpoint backed out;
      # see the RESULTS_URL note above.) Best-effort: never fails the job.
      - name: Publish results + Slack alert on failure
        if: always()
        run: npx tsx scripts/publish-results.ts

      - name: Upload Allure results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ github.run_number }}
          path: |
            allure-results
            allure-report
          retention-days: 14

      - name: Upload failure traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results
          retention-days: 14

  # Deployment marker whose only job is the URL chip on the run graph — the
  # same environment+url mechanism GitHub's own pages-build-deployment uses.
  # The e2e job can't carry it: it already uses the `qa` environment for its
  # secrets, and a job gets exactly one environment.
  report:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: allure-report
      url: ${{ needs.e2e.outputs.report_url || 'https://restaunax.github.io/Automation/nightly/' }}
    steps:
      - name: Report published
        run: echo "Allure report — ${{ needs.e2e.outputs.report_url || 'https://restaunax.github.io/Automation/nightly/' }} (live once pages-build-deployment finishes, ~1 min)"
