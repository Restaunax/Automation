# Static checks — no secrets, no QA access, ~1 minute. Blocks merge on failure.
# See CI_PLAN.md for the full pipeline design.
name: static

on:
  pull_request:
  push:
    branches: [QA, main]

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
