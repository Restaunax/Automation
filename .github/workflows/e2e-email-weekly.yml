# Targeted email-flow validation against QA — MANUAL DISPATCH ONLY.
#
# The @email group (demo request/management/actions, admin invite + password
# reset + invite→claim journey, sign-up, gift-card purchases) sends real mail to
# QA's self-hosted Mailpit inbox. It used to run weekly here because the old
# Mailtrap sandbox was metered and the main suite had to exclude it; Mailpit is
# unmetered, so e2e.yml now covers @email on every run and the weekly schedule
# is retired. This workflow survives for on-demand runs of just that group —
# debugging an email flow without paying for the full suite.
#
# Keep the dedicated `email/` Allure subfolder: the report cleanup deletes
# non-numeric siblings, so a report parked at another suite's level gets wiped.
name: e2e-email-weekly

on:
  workflow_dispatch:

# Share the single Playwright concurrency group with the nightly: the suite
# mutates one shared QA environment, so these two must never run at once.
concurrency:
  group: qa-e2e
  cancel-in-progress: false

jobs:
  e2e-email:
    if: github.repository == 'Restaunax/Automation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa
    # peaceiris/actions-gh-pages pushes the built Allure report to the gh-pages
    # branch using the default GITHUB_TOKEN, which needs write access to contents.
    permissions:
      contents: write
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      TEMPLATE_WIND_URL: ${{ vars.TEMPLATE_WIND_URL }}
      TEMPLATE_WIND_RESTAURANT_ID: ${{ vars.TEMPLATE_WIND_RESTAURANT_ID }}
      SEED_RESTAURANT_ID: ${{ vars.SEED_RESTAURANT_ID }}
      TEST_EMAIL_DOMAIN: ${{ vars.TEST_EMAIL_DOMAIN }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_EMAIL: ${{ secrets.EMPLOYEE_EMAIL }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      MAILPIT_BASE_URL: ${{ vars.MAILPIT_BASE_URL }}
      MAILPIT_UI_USER: ${{ secrets.MAILPIT_UI_USER }}
      MAILPIT_UI_PASSWORD: ${{ secrets.MAILPIT_UI_PASSWORD }}
      RESULTS_URL: ${{ secrets.RESULTS_URL }}
      RESULTS_API_KEY: ${{ secrets.RESULTS_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      E2E_TRIGGER: email-manual
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the @email group
        run: |
          # --grep @email selects exactly the mail-sending tests. Config
          # reporters (list + json + allure) are kept — no --reporter override.
          npx playwright test --grep @email

      - name: Generate Allure HTML report
        if: always()
        run: npx allure generate allure-results -o allure-report --clean

      # ── Publish the Allure report to GitHub Pages ─────────────────────────────
      # Same pipeline as e2e.yml, but under the email/ subfolder →
      # https://restaunax.github.io/Automation/email/ (the nightly owns nightly/
      # and the root redirect). Each suite MUST have its own subfolder:
      # simple-elf's keep_reports cleanup deletes non-numeric siblings first, so
      # a report parked next to another suite's run folders would get wiped.
      # keep_reports 30 ≈ 7 months of weekly runs. All if: always() so a failing
      # run still publishes. No gh-pages push race with the nightly: both
      # workflows share the qa-e2e concurrency group.
      - name: Fetch prior Allure history
        if: always()
        continue-on-error: true # gh-pages doesn't exist yet on the very first run
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: email
          keep_reports: 30

      # simple-elf runs as root in a container and copies the checked-out gh-pages
      # folder — including its .git — into allure-history. peaceiris then can't
      # delete that root-owned .git (EACCES) and its push fails. Strip it (sudo,
      # because the files are root-owned) so peaceiris sees only report files.
      - name: Strip the stray .git from the report dir
        if: always()
        run: sudo rm -rf allure-history/.git

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Link hosted report in run summary
        if: always()
        run: |
          echo "### 📊 Allure report (@email group)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://restaunax.github.io/Automation/email/ — live once pages-build-deployment finishes (~1 min)" >> "$GITHUB_STEP_SUMMARY"

      # Parse results.json and Slack on real failures. (The Grafana ingest POST
      # is a no-op — endpoint backed out; see e2e.yml.) Best-effort:
      # never fails the job.
      - name: Publish results + Slack alert on failure
        if: always()
        run: npx tsx scripts/publish-results.ts

      - name: Upload Allure results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-email-${{ github.run_number }}
          path: |
            allure-results
            allure-report
          retention-days: 14

      - name: Upload failure traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-email-${{ github.run_number }}
          path: test-results
          retention-days: 14

  # Deployment marker whose only job is the URL chip on the run graph — the
  # same environment+url mechanism GitHub's own pages-build-deployment uses.
  # The e2e-email job can't carry it: it already uses the `qa` environment for
  # its secrets, and a job gets exactly one environment.
  report:
    needs: e2e-email
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: allure-report
      url: https://restaunax.github.io/Automation/email/
    steps:
      - name: Report published
        run: echo "Allure report — https://restaunax.github.io/Automation/email/ (live once pages-build-deployment finishes, ~1 min)"
