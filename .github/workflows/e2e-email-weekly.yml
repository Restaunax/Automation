# Deliberate email-flow validation against QA.
#
# The @email group (demo request/management/actions, admin invite + password
# reset + invite→claim journey, sign-up, gift-card purchases) actually sends
# mail through the quota-limited Mailtrap sandbox (~19 emails per full run, demo
# = 2 each). The nightly (e2e-nightly.yml) EXCLUDES @email so routine runs never
# drain the 500/mo cap; this job is where those flows get exercised on purpose —
# weekly, plus on-demand. INCLUDE_EMAIL_TESTS=1 turns off the config's default
# exclusion so `--grep @email` selects exactly that group.
name: e2e-email-weekly

on:
  schedule:
    # 06:00 UTC every Monday — ~19 emails/run × ~4 runs/mo ≈ 76/mo, well under 500.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Share the single Playwright concurrency group with the nightly: the suite
# mutates one shared QA environment, so these two must never run at once.
concurrency:
  group: qa-e2e
  cancel-in-progress: false

jobs:
  e2e-email:
    if: github.repository == 'Restaunax/Automation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa
    # peaceiris/actions-gh-pages pushes the built Allure report to the gh-pages
    # branch using the default GITHUB_TOKEN, which needs write access to contents.
    permissions:
      contents: write
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      TEMPLATE_WIND_URL: ${{ vars.TEMPLATE_WIND_URL }}
      TEMPLATE_WIND_RESTAURANT_ID: ${{ vars.TEMPLATE_WIND_RESTAURANT_ID }}
      SEED_RESTAURANT_ID: ${{ vars.SEED_RESTAURANT_ID }}
      TEST_EMAIL_DOMAIN: ${{ vars.TEST_EMAIL_DOMAIN }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_EMAIL: ${{ secrets.EMPLOYEE_EMAIL }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
      MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}
      RESULTS_URL: ${{ secrets.RESULTS_URL }}
      RESULTS_API_KEY: ${{ secrets.RESULTS_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Opt in to the email group (drops the config's default @email exclusion).
      INCLUDE_EMAIL_TESTS: "1"
      E2E_TRIGGER: ${{ github.event_name == 'schedule' && 'email-weekly' || 'email-manual' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the @email group
        run: |
          # INCLUDE_EMAIL_TESTS=1 (env above) removes the default exclusion, then
          # --grep @email runs exactly the mail-sending tests. Config reporters
          # (list + json + allure) are kept — no --reporter override.
          npx playwright test --grep @email

      - name: Generate Allure HTML report
        if: always()
        run: npx allure generate allure-results -o allure-report --clean

      # ── Publish the Allure report to GitHub Pages ─────────────────────────────
      # Same pipeline as e2e-nightly.yml, but under the email/ subfolder →
      # https://restaunax.github.io/Automation/email/ (the nightly owns nightly/
      # and the root redirect). Each suite MUST have its own subfolder:
      # simple-elf's keep_reports cleanup deletes non-numeric siblings first, so
      # a report parked next to another suite's run folders would get wiped.
      # keep_reports 30 ≈ 7 months of weekly runs. All if: always() so a failing
      # run still publishes. No gh-pages push race with the nightly: both
      # workflows share the qa-e2e concurrency group.
      - name: Fetch prior Allure history
        if: always()
        continue-on-error: true # gh-pages doesn't exist yet on the very first run
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: email
          keep_reports: 30

      # simple-elf runs as root in a container and copies the checked-out gh-pages
      # folder — including its .git — into allure-history. peaceiris then can't
      # delete that root-owned .git (EACCES) and its push fails. Strip it (sudo,
      # because the files are root-owned) so peaceiris sees only report files.
      - name: Strip the stray .git from the report dir
        if: always()
        run: sudo rm -rf allure-history/.git

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Link hosted report in run summary
        if: always()
        run: |
          echo "### 📊 Allure report (@email group)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://restaunax.github.io/Automation/email/ — live once pages-build-deployment finishes (~1 min)" >> "$GITHUB_STEP_SUMMARY"

      # Parse results.json and Slack on real failures. (The Grafana ingest POST
      # is a no-op — endpoint backed out; see e2e-nightly.yml.) Best-effort:
      # never fails the job.
      - name: Publish results + Slack alert on failure
        if: always()
        run: npx tsx scripts/publish-results.ts

      - name: Upload Allure results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-email-${{ github.run_number }}
          path: |
            allure-results
            allure-report
          retention-days: 14

      - name: Upload failure traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-email-${{ github.run_number }}
          path: test-results
          retention-days: 14
